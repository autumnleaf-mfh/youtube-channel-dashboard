<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07100d">
  <meta name="description" content="13 个财经 YouTube 频道的订阅、播放与近 7 日更新">
  <title>YouTube 频道数据</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <h1 class="sr-only">YouTube 频道数据</h1>

    <section class="chart-grid" aria-label="频道汇总">
      <article class="panel chart-panel">
        <header class="panel-heading">
          <div>
            <p class="eyebrow">SUBSCRIBERS</p>
            <h2>公开订阅合计</h2>
          </div>
          <div class="metric-actions">
            <span id="subscriberNote" class="note"></span>
            <div id="subscriberPeriod" class="period-switch" aria-label="公开订阅比较区间">
              <button type="button" data-period="7" aria-pressed="true">7D</button>
              <button type="button" data-period="30" aria-pressed="false">30D</button>
              <button type="button" data-period="all" aria-pressed="false">ALL</button>
            </div>
          </div>
        </header>
        <div id="subscriberChart" class="donut" aria-live="polite"></div>
      </article>

      <article class="panel chart-panel">
        <header class="panel-heading">
          <div>
            <p class="eyebrow">CHANNEL VIEWS</p>
            <h2>频道总播放合计</h2>
          </div>
          <div class="metric-actions">
            <span class="note">当前公开值</span>
            <div id="viewsPeriod" class="period-switch" aria-label="频道播放比较区间">
              <button type="button" data-period="7" aria-pressed="true">7D</button>
              <button type="button" data-period="30" aria-pressed="false">30D</button>
              <button type="button" data-period="all" aria-pressed="false">ALL</button>
            </div>
          </div>
        </header>
        <div id="viewsChart" class="donut" aria-live="polite"></div>
      </article>

      <article class="panel updates-panel" aria-labelledby="updatesTitle">
        <header class="panel-heading updates-heading">
          <div>
            <p class="eyebrow">LAST 7 DAYS</p>
            <h2 id="updatesTitle">近 7 日更新</h2>
          </div>
          <span id="updateCount" class="note"></span>
        </header>
        <ol id="updatesList" class="updates-list"></ol>
      </article>
    </section>

    <section class="panel trend-panel" aria-labelledby="trendTitle">
      <header class="trend-header">
        <div>
          <p class="eyebrow">VIDEO TREND</p>
          <h2 id="trendTitle">频道内容趋势对比</h2>
          <p>按视频发布时间排列；播放、点赞及评论为当前累计值。</p>
        </div>
        <div class="trend-controls">
          <label>频道<select id="primaryChannel" aria-label="选择频道"></select></label>
          <label>对比<select id="comparisonChannel" aria-label="选择对比频道"></select></label>
          <label>指标<select id="trendMetric" aria-label="选择趋势指标"><option value="viewCount">播放量</option><option value="durationSeconds">播放时长</option><option value="likeCount">点赞数量</option><option value="commentCount">评论数量</option></select></label>
        </div>
      </header>
      <div id="trendLegend" class="trend-legend"></div>
      <div id="trendChart" class="trend-chart" aria-live="polite"></div>
    </section>

    <div id="loadError" class="load-error" hidden></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
