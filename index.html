<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07100d">
  <meta name="description" content="13 个财经 YouTube 频道的订阅、播放与近 7 日更新">
  <title>YouTube 频道数据</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <h1 class="sr-only">YouTube 频道数据</h1>

    <section class="chart-grid" aria-label="频道汇总">
      <article class="panel chart-panel">
        <header class="panel-heading">
          <div>
            <p class="eyebrow">SUBSCRIBERS</p>
            <h2>公开订阅合计</h2>
          </div>
          <span id="subscriberNote" class="note"></span>
        </header>
        <div id="subscriberChart" class="donut" aria-live="polite"></div>
      </article>

      <article class="panel chart-panel">
        <header class="panel-heading">
          <div>
            <p class="eyebrow">CHANNEL VIEWS</p>
            <h2>频道总播放合计</h2>
          </div>
          <span class="note">当前公开值</span>
        </header>
        <div id="viewsChart" class="donut" aria-live="polite"></div>
      </article>
    </section>

    <section class="panel updates-panel" aria-labelledby="updatesTitle">
      <header class="panel-heading updates-heading">
        <div>
          <p class="eyebrow">LAST 7 DAYS</p>
          <h2 id="updatesTitle">近 7 日更新</h2>
        </div>
        <span id="updateCount" class="note"></span>
      </header>
      <ol id="updatesList" class="updates-list"></ol>
    </section>

    <div id="loadError" class="load-error" hidden></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
