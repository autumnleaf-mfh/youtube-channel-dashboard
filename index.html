<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07100d">
  <meta name="description" content="13 个财经 YouTube 频道的订阅、播放与近 7 日更新">
  <title>YouTube 频道数据</title>
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
  <main class="dashboard">
    <h1 class="sr-only">YouTube 频道数据</h1>

    <section class="chart-grid" aria-label="频道汇总">
      <article class="panel chart-panel">
        <header class="panel-heading">
          <div>
            <p class="eyebrow">SUBSCRIBERS</p>
            <h2>公开订阅合计</h2>
          </div>
          <div class="metric-actions">
            <span id="subscriberNote" class="note"></span>
            <div id="subscriberPeriod" class="period-switch" aria-label="公开订阅比较区间">
              <button type="button" data-period="7" aria-pressed="false" aria-disabled="true">7D</button>
              <button type="button" data-period="30" aria-pressed="false" aria-disabled="true">30D</button>
              <button type="button" data-period="all" aria-pressed="true">ALL</button>
            </div>
          </div>
        </header>
        <div id="subscriberChart" class="donut" aria-live="polite"></div>
      </article>

      <article class="panel chart-panel">
        <header class="panel-heading">
          <div>
            <p class="eyebrow">CHANNEL VIEWS</p>
            <h2>频道总播放合计</h2>
          </div>
          <div class="metric-actions">
            <span id="viewsNote" class="note">按发布时间统计</span>
            <div id="viewsPeriod" class="period-switch" aria-label="频道播放比较区间">
              <button type="button" data-period="7" aria-pressed="true">7D</button>
              <button type="button" data-period="30" aria-pressed="false">30D</button>
              <button type="button" data-period="all" aria-pressed="false">ALL</button>
            </div>
          </div>
        </header>
        <div id="viewsChart" class="donut" aria-live="polite"></div>
      </article>

      <article class="panel updates-panel" aria-labelledby="updatesTitle">
        <header class="panel-heading updates-heading">
          <div>
            <p class="eyebrow">LAST 7 DAYS</p>
            <h2 id="updatesTitle">近 7 日更新</h2>
          </div>
          <span id="updateCount" class="note"></span>
        </header>
        <ol id="updatesList" class="updates-list"></ol>
      </article>
    </section>

    <section class="panel trend-panel" aria-labelledby="trendTitle">
      <header class="trend-header">
        <div class="trend-title-row">
          <div>
            <p class="eyebrow">VIDEO TREND</p>
            <h2 id="trendTitle">频道内容趋势对比</h2>
            <p id="trendDescription">近 7 日发布视频；播放、时长、点赞及评论为当前累计值。</p>
          </div>
          <div id="trendPeriod" class="period-switch trend-period-switch" aria-label="频道内容趋势时间窗口">
            <button type="button" data-value="7" aria-pressed="true">7D</button>
            <button type="button" data-value="30" aria-pressed="false">30D</button>
            <button type="button" data-value="90" aria-pressed="false">90D</button>
            <button type="button" data-value="all" aria-pressed="false">ALL</button>
          </div>
        </div>
        <div class="trend-controls">
          <div class="selector-row"><span>频道</span><div id="primaryChannel" class="choice-buttons" aria-label="选择频道"></div></div>
          <div class="selector-row"><span>对比</span><div id="comparisonChannel" class="choice-buttons" aria-label="选择对比频道"></div></div>
          <div class="selector-row"><span>指标</span><div id="trendMetric" class="choice-buttons compact-choices" aria-label="选择趋势指标"><button type="button" data-value="viewCount" aria-pressed="true"><i aria-hidden="true">▶</i>播放量</button><button type="button" data-value="durationSeconds" aria-pressed="false"><i aria-hidden="true">◷</i>播放时长</button><button type="button" data-value="likeCount" aria-pressed="false"><i aria-hidden="true">♥</i>点赞数量</button><button type="button" data-value="commentCount" aria-pressed="false"><i aria-hidden="true">▰</i>评论数量</button><button type="button" data-value="uploadCount" aria-pressed="false"><i aria-hidden="true">↻</i>更新数量</button></div></div>
          <div id="comparisonMetricRow" class="selector-row comparison-metric-row" hidden><span>对比指标</span><div id="comparisonMetric" class="choice-buttons compact-choices" aria-label="选择对比频道指标"><button type="button" data-value="viewCount" aria-pressed="true"><i aria-hidden="true">▶</i>播放量</button><button type="button" data-value="durationSeconds" aria-pressed="false"><i aria-hidden="true">◷</i>播放时长</button><button type="button" data-value="likeCount" aria-pressed="false"><i aria-hidden="true">♥</i>点赞数量</button><button type="button" data-value="commentCount" aria-pressed="false"><i aria-hidden="true">▰</i>评论数量</button><button type="button" data-value="uploadCount" aria-pressed="false"><i aria-hidden="true">↻</i>更新数量</button></div></div>
        </div>
      </header>
      <div id="trendLegend" class="trend-legend"></div>
      <div id="trendChart" class="trend-chart" aria-live="polite"></div>
    </section>

    <div id="loadError" class="load-error" hidden></div>
  </main>
  <script src="app.js?v=17" defer></script>
</body>
</html>
